server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mbrm_auth
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: mySuperSecretKeyForJwtToken123456789
  expiration: 86400000